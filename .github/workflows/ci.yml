name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt bandit==1.9.4

      - name: Lancer les tests
        run: python -m pytest -v

      - name: Analyse de sécurité du code (SAST)
        run: bandit -r app/ -ll

  image:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.75.0"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Calculer la version et le nom de l'image
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/monapp:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build \
            --build-arg VERSION="${VERSION}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}" .

      - name: Scanner l'image avec Trivy (avant publication)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${IMAGE}"

      - name: Publier l'image sur ghcr.io
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push "${IMAGE}"
